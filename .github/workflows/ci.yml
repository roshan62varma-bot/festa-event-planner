name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Report every Node version independently instead of cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        # Vitest and jsdom require Node 22.12 or newer.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests with coverage thresholds
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm run audit:prod
